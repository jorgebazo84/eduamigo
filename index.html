<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EduAmigo</title>
    <meta name="description" content="EduAmigo Tutor Inteligente">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#001220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduAmigo">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Browser Polyfills & Error Safety Net -->
    <script>
      (function() {
        // 1. Polyfill process & global for browser environments (@google/genai, google-logging-utils)
        window.process = window.process || {
          env: { NODE_ENV: 'development', GEMINI_API_KEY: '' },
          stderr: null,
          stdout: null,
          browser: true,
          platform: 'browser',
          version: '',
          versions: {},
          cwd: function() { return '/'; },
          nextTick: function(fn) { setTimeout(fn, 0); }
        };
        window.global = window;

        // 2. Global error boundary for initial script/module loading
        window.addEventListener('error', function(e) {
          console.error('[EduAmigo Startup Error]', e);
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0 || root.querySelector('#app-init-loader'))) {
            var msg = (e && (e.message || (e.error && e.error.message))) || 'Error al iniciar la aplicación';
            root.innerHTML = '<div style="min-height: 100vh; background: #001220; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; color: white; font-family: system-ui, sans-serif; text-align: center;">' +
              '<div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 32px; max-width: 440px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5);">' +
                '<span style="font-size: 40px; display: block; margin-bottom: 12px;">🎓</span>' +
                '<h2 style="color: #00B4D8; margin: 0 0 8px 0; font-size: 24px; font-weight: 900;">EduAmigo</h2>' +
                '<p style="color: #94a3b8; font-size: 13px; margin: 0 0 16px 0;">Se detectó un detalle al cargar el entorno:</p>' +
                '<pre style="background: rgba(0,0,0,0.6); color: #fca5a5; padding: 12px; border-radius: 12px; font-size: 11px; text-align: left; overflow: auto; max-height: 120px; margin-bottom: 20px;">' + msg + '</pre>' +
                '<button onclick="location.reload()" style="background: #00B4D8; color: #001220; border: none; padding: 14px 24px; border-radius: 14px; font-weight: 900; cursor: pointer; font-size: 14px; width: 100%; transition: all 0.2s;">Recargar Aula</button>' +
              '</div>' +
            '</div>';
          }
        });

        // 3. Purge stale Service Workers and browser caches
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            });
          }
        } catch (swErr) {}
      })();
    </script>
</head>
<body style="margin: 0; background-color: #001220;">
    <div id="root">
      <div id="app-init-loader" style="min-height: 100vh; background: #001220; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Quicksand', system-ui, sans-serif; color: white; text-align: center; padding: 24px;">
        <div style="width: 72px; height: 72px; background: #001220; border: 2px solid rgba(0, 180, 216, 0.4); border-radius: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0, 180, 216, 0.2);">
          <span style="color: #00B4D8; font-weight: 900; font-size: 28px;">21</span>
        </div>
        <h1 style="font-size: 26px; font-weight: 900; color: #ffffff; margin: 0 0 6px 0; letter-spacing: -0.5px;">EduAmigo</h1>
        <p style="font-size: 11px; font-weight: 700; color: #00B4D8; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 24px 0;">Iniciando aula virtual...</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(0, 180, 216, 0.2); border-top-color: #00B4D8; border-radius: 50%; animation: eduamigo-spin 0.8s linear infinite;"></div>
        <style>@keyframes eduamigo-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
